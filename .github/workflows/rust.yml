name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/**"
      - "Cargo.toml"
      - "build.rs"
      - "assets/**"
      - "src/**"
      - "crates/**"
      - "tests/**"
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2

      # Vulkan (lavapipe) so the egui_kittest snapshot tests can render without
      # a GPU; xkbcommon and Wayland for winit.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The committed snapshot images are recorded on macOS. Other GPUs
      # rasterize slightly differently, so there the snapshots are re-recorded
      # instead of compared, and uploaded for review below; every other
      # assertion still fails the job.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" != macOS ]; then export UPDATE_SNAPSHOTS=1; fi
          cargo test --workspace --no-fail-fast
      - name: Upload re-recorded snapshots
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: tests/snapshots/
          if-no-files-found: ignore

  build-unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --package rusty_hub --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: upload executable
          path: target/release/rusty_hub
