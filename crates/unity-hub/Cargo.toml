[package]
name = "unity-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Finds Unity editors and projects on disk; knows nothing about the UI."

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
exe = "0.5"
registry = "1.3"
dpc-pariter = "0.5.1"

[dev-dependencies]
tempfile = "3"
toml = "1"

[lints]
workspace = true
