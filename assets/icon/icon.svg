<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Rusty Hub</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="28" x2="0" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c3c41"/>
      <stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="-190" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7935a"/>
      <stop offset="1" stop-color="#c2471a"/>
    </linearGradient>
  </defs>

  <!-- Plate, in the app's graphite. -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#plate)"/>
  <rect x="29.5" y="29.5" width="453" height="453" rx="102.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>

  <g transform="translate(256 256)">
    <!-- Cog: eight teeth (a dashed circle) on a solid ring. -->
    <circle r="168" fill="none" stroke="url(#rust)" stroke-width="44" stroke-dasharray="65.97 65.97" stroke-dashoffset="33"/>
    <circle r="142" fill="none" stroke="url(#rust)" stroke-width="34"/>

    <!-- Hub: a centre joined to three projects. -->
    <g stroke="#f2f2f5" stroke-width="20" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-72"/>
      <line x1="0" y1="0" x2="62.35" y2="36"/>
      <line x1="0" y1="0" x2="-62.35" y2="36"/>
    </g>
    <g fill="#f2f2f5">
      <circle r="32"/>
      <circle cx="0" cy="-72" r="23"/>
      <circle cx="62.35" cy="36" r="23"/>
      <circle cx="-62.35" cy="36" r="23"/>
    </g>
  </g>
</svg>
